<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: file:; font-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>Markdown Editor</title>
</head>

<body class="theme-light" id="app-body"><!-- ── Toolbar ─────────────────────────────────────────── -->
  <div class="toolbar" id="toolbar">
    <div class="toolbar-left"><!-- Logo -->
      <div class="app-logo">
        <div class="app-logo-icon">M↓</div><span>Markdown Editor</span>
      </div>
    </div>
    <div class="toolbar-right"><!-- Custom window controls -->
      <div class="window-controls" id="window-controls"><button class="win-ctrl" id="win-min" title="最小化"
          aria-label="Minimize"><svg aria-hidden="true" viewBox="0 0 10 10" width="10" height="10">
            <path d="M0 5h10" stroke="currentColor" stroke-width="1" />
          </svg></button><button class="win-ctrl" id="win-max" title="最大化" aria-label="Maximize"><svg aria-hidden="true"
            viewBox="0 0 10 10" width="10" height="10" id="win-max-icon">
            <rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1" />
          </svg></button><button class="win-ctrl win-ctrl-close" id="win-close" title="关闭" aria-label="Close"><svg
            aria-hidden="true" viewBox="0 0 10 10" width="10" height="10">
            <path d="M0 0l10 10M10 0l-10 10" stroke="currentColor" stroke-width="1" />
          </svg></button></div>
    </div>
  </div>
  <!-- ── Format Toolbar (second row) ──────────────────────── -->
  <div class="format-toolbar" id="format-toolbar"><!-- File ops -->
    <div class="toolbar-btn-group"><button class="toolbar-btn" id="btn-new" title="新建 (Ctrl+N)"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="12" y1="18" x2="12" y2="12" />
          <line x1="9" y1="15" x2="15" y2="15" />
        </svg></button><button class="toolbar-btn" id="btn-open" title="打开 (Ctrl+O)"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
        </svg></button><button class="toolbar-btn" id="btn-save" title="保存 (Ctrl+S)"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
          <polyline points="17 21 17 13 7 13 7 21" />
          <polyline points="7 3 7 8 15 8" />
        </svg></button></div>
    <div class="toolbar-separator"></div><!-- Format buttons -->
    <div class="toolbar-btn-group"><button class="toolbar-btn fmt-btn" data-action="heading"
        title="标题 (循环 H1→H2→H3)"><svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M6 12h12M6 4v16M18 4v16" stroke-width="2.2" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="bold" title="粗体 (Ctrl+B)"><svg
          aria-hidden="true" viewBox="0 0 24 24">
          <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
          <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="italic" title="斜体 (Ctrl+I)"><svg
          aria-hidden="true" viewBox="0 0 24 24">
          <line x1="19" y1="4" x2="10" y2="4" />
          <line x1="14" y1="20" x2="5" y2="20" />
          <line x1="15" y1="4" x2="9" y2="20" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="strikethrough" title="删除线"><svg
          aria-hidden="true" viewBox="0 0 24 24">
          <path d="M16 4H9a3 3 0 0 0-2.83 4" />
          <path d="M14 20H8a3 3 0 0 1-2.83-4" />
          <path d="M4 12h16" />
        </svg></button>
      <div class="toolbar-separator" style="margin: 0 6px"></div><button class="toolbar-btn fmt-btn" data-action="link"
        title="插入链接"><svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="image" title="插入图片"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <circle cx="8.5" cy="8.5" r="1.5" />
          <polyline points="21 15 16 10 5 21" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="code" title="行内代码"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="codeblock" title="代码块"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
          <line x1="12" y1="2" x2="12" y2="22" opacity="0.3" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="quote" title="引用"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <path
            d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" />
          <path
            d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3c0 1 0 1 1 1z" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="table" title="插入表格"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="1" />
          <path d="M3 9h18M3 15h18M9 3v18" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="ul" title="无序列表"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <line x1="9" y1="6" x2="20" y2="6" />
          <line x1="9" y1="12" x2="20" y2="12" />
          <line x1="9" y1="18" x2="20" y2="18" />
          <circle cx="4" cy="6" r="1" fill="currentColor" stroke="none" />
          <circle cx="4" cy="12" r="1" fill="currentColor" stroke="none" />
          <circle cx="4" cy="18" r="1" fill="currentColor" stroke="none" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="ol" title="有序列表"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <line x1="10" y1="6" x2="21" y2="6" />
          <line x1="10" y1="12" x2="21" y2="12" />
          <line x1="10" y1="18" x2="21" y2="18" />
          <path d="M4 6h1v4" stroke-width="1.8" />
          <path d="M4 10h2" stroke-width="1.8" />
          <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" stroke-width="1.8" />
        </svg></button><button class="toolbar-btn fmt-btn" data-action="hr" title="分割线"><svg aria-hidden="true"
          viewBox="0 0 24 24">
          <line x1="3" y1="12" x2="21" y2="12" stroke-width="2.5" />
          <line x1="3" y1="6" x2="21" y2="6" opacity="0.2" />
          <line x1="3" y1="18" x2="21" y2="18" opacity="0.2" />
        </svg></button>
    </div>
    <div class="format-toolbar-spacer"></div>
    <!-- Template -->
    <button class="toolbar-btn toolbar-action-btn" id="btn-template" title="模板库"><svg aria-hidden="true"
        viewBox="0 0 24 24" style="
            width: 13px;
            height: 13px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
          ">
        <rect x="3" y="3" width="7" height="7" />
        <rect x="14" y="3" width="7" height="7" />
        <rect x="14" y="14" width="7" height="7" />
        <rect x="3" y="14" width="7" height="7" />
      </svg>
      模板
    </button><!-- Export -->
    <div class="export-wrap"><button class="toolbar-btn toolbar-action-btn" id="btn-export" title="导出文件"><svg
          aria-hidden="true" viewBox="0 0 24 24" style="
              width: 13px;
              height: 13px;
              fill: none;
              stroke: currentColor;
              stroke-width: 2;
              stroke-linecap: round;
              stroke-linejoin: round;
            ">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" y1="15" x2="12" y2="3" />
        </svg>
        导出
        <svg aria-hidden="true" viewBox="0 0 24 24" style="
              width: 10px;
              height: 10px;
              fill: none;
              stroke: currentColor;
              stroke-width: 2.5;
              stroke-linecap: round;
              stroke-linejoin: round;
              opacity: 0.6;
            ">
          <polyline points="6 9 12 15 18 9" />
        </svg></button>
      <div class="export-menu" id="export-menu">
        <div class="export-item" data-type="md"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
          </svg>
          导出 Markdown </div>
        <div class="export-item" data-type="html"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 18 22 12 16 6" />
            <polyline points="8 6 2 12 8 18" />
          </svg>
          导出 HTML </div>
        <div class="export-item" data-type="pdf"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="9" y1="15" x2="15" y2="15" />
          </svg>
          导出 PDF </div>
        <div class="export-separator"></div>
        <div class="export-item" data-type="settings"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.07 4.93a10 10 0 0 1 1.41 13.37" />
          </svg>
          导出设置...
        </div>
      </div>
    </div>
    <div class="toolbar-separator"></div><!-- View toggle --><button class="toolbar-btn" id="btn-view-toggle"
      title="切换视图 (Ctrl+\)"><svg aria-hidden="true" viewBox="0 0 24 24" id="view-icon">
        <rect x="3" y="3" width="8" height="18" rx="1" />
        <rect x="13" y="3" width="8" height="18" rx="1" />
      </svg></button><!-- Swap panes --><button class="toolbar-btn" id="btn-swap-panes"
      title="互换编辑/预览位置 (Ctrl+Shift+\)"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="8" height="18" rx="1" opacity="0.4" />
        <rect x="13" y="3" width="8" height="18" rx="1" opacity="0.4" />
        <path d="M7 9l-3 3 3 3" stroke-width="1.8" />
        <path d="M17 9l3 3-3 3" stroke-width="1.8" />
        <line x1="4" y1="12" x2="20" y2="12" stroke-width="1.5" />
      </svg></button><!-- Theme --><button class="toolbar-btn" id="btn-theme" title="切换主题 (Ctrl+Shift+T)"><svg
        aria-hidden="true" viewBox="0 0 24 24" id="theme-icon">
        <circle cx="12" cy="12" r="5" />
        <line x1="12" y1="1" x2="12" y2="3" />
        <line x1="12" y1="21" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="3" y2="12" />
        <line x1="21" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      </svg></button><!-- Settings --><button class="toolbar-btn" id="btn-settings" title="设置"><svg aria-hidden="true"
        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path
          d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
      </svg></button>
  </div><!-- ── Tab Bar ──────────────────────────────────────────── -->
  <div class="tabbar" id="tabbar">
    <div class="tabs-container" id="tabs-container"></div><button class="tab-new-btn" id="btn-tab-new"
      title="新建标签页 (Ctrl+T)">+</button>
  </div><!-- ── Main Area ───────────────────────────────────────── -->
  <div class="main-area" id="main-area">
    <div class="editor-pane" id="editor-pane">
      <div class="pane-header"><span class="pane-label">编辑</span><span class="word-count" id="word-count">0 字</span>
      </div>
      <div class="editor-container" id="editor-container"></div><!-- Welcome overlay -->
      <div class="welcome-overlay hidden" id="welcome-overlay">
        <div class="welcome-panel">
          <div class="welcome-icon">M↓</div>
          <h1 class="welcome-title">Markdown Editor</h1>
          <p class="welcome-subtitle">开始写作</p>
          <div class="welcome-actions"><button class="welcome-btn" id="welcome-new"><svg aria-hidden="true"
                viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
                <line x1="12" y1="18" x2="12" y2="12" />
                <line x1="9" y1="15" x2="15" y2="15" />
              </svg>
              新建文档 </button><button class="welcome-btn" id="welcome-open"><svg aria-hidden="true" viewBox="0 0 24 24"
                width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
              </svg>
              打开文件 </button><button class="welcome-btn" id="welcome-template"><svg aria-hidden="true"
                viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
              </svg>
              从模板创建
            </button></div>
          <div class="welcome-shortcuts"><span class="welcome-shortcut"><kbd>Ctrl+N</kbd> 新建</span><span
              class="welcome-shortcut"><kbd>Ctrl+O</kbd> 打开</span><span class="welcome-shortcut"><kbd>Ctrl+S</kbd>
              保存</span><span class="welcome-shortcut"><kbd>Ctrl+P</kbd> 命令面板</span></div>
        </div>
      </div><!-- Find/Replace overlay -->
      <div class="find-panel" id="find-panel">
        <div class="find-row">
          <div class="find-input-wrap"><input type="text" id="find-input" placeholder="输入要查找的内容" aria-label="查找"
              spellcheck="false" /><span class="find-count" id="find-count"></span></div>
          <div class="find-opts"><button class="find-opt" id="find-opt-case" title="区分大小写 (Alt+C)">Aa</button><button
              class="find-opt" id="find-opt-word" title="全词匹配 (Alt+W)">Ab</button><button class="find-opt"
              id="find-opt-regex" title="正则表达式 (Alt+R)">.*</button></div>
          <div class="find-actions"><button class="find-btn" id="find-prev" title="上一个 (Shift+Enter / Shift+F3)"><svg
                aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15" />
              </svg></button><button class="find-btn" id="find-next" title="下一个 (Enter / F3)"><svg aria-hidden="true"
                viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9" />
              </svg></button><button class="find-btn" id="find-toggle-replace" title="替换模式 (Ctrl+H)"><svg
                aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="17 1 21 5 17 9" />
                <path d="M3 11V9a4 4 0 0 1 4-4h14" />
                <polyline points="7 23 3 19 7 15" />
                <path d="M21 13v2a4 4 0 0 1-4 4H3" />
              </svg></button><button class="find-btn" id="find-close" title="关闭 (Esc)">✕</button></div>
        </div>
        <div class="find-row find-replace-row" hidden>
          <div class="find-input-wrap"><input type="text" id="replace-input" placeholder="替换为" aria-label="替换为"
              spellcheck="false" /></div>
          <div class="find-actions"><button class="find-btn find-btn-text" id="replace-one">替换</button><button
              class="find-btn find-btn-text" id="replace-all">全部</button></div>
        </div>
        <div class="find-hints"><span class="find-hint"><kbd>Enter</kbd> 下一个</span><span
            class="find-hint"><kbd>Shift</kbd>+<kbd>Enter</kbd> 上一个</span><span class="find-hint"><kbd>Esc</kbd>
            关闭</span></div>
      </div>
    </div>
    <div class="divider" id="divider"></div>
    <div class="preview-pane" id="preview-pane">
      <div class="pane-header"><span class="pane-label">预览</span><label class="sync-scroll-toggle"><input
            type="checkbox" id="sync-scroll" checked /><span>同步滚动</span></label></div>
      <div class="preview-container" id="preview-container">
        <article class="markdown-body" id="preview-body"></article>
      </div>
    </div>
  </div><!-- ── Status Bar ──────────────────────────────────────── -->
  <div class="statusbar" id="statusbar">
    <div class="statusbar-left"><span id="status-file">未命名</span><span class="statusbar-sep">·</span><span
        id="status-modified"></span><span class="statusbar-sep" id="status-sep2">·</span><span id="status-cursor">行 1, 列
        1</span><span class="statusbar-sep">·</span><span id="status-selection"></span></div>
    <div class="statusbar-right"><span id="status-readtime"></span><span class="statusbar-sep" id="status-readtime-sep"
        style="display: none">·</span><span id="status-chars"></span><span class="statusbar-sep" id="status-chars-sep"
        style="display: none">·</span><span id="status-autosave"></span><span class="statusbar-sep"
        id="status-autosave-sep" style="display: none">·</span><span id="status-encoding">UTF-8</span><span
        class="statusbar-sep">·</span><span class="statusbar-palette-hint" id="status-palette-hint"
        title="命令面板 (Ctrl+P)">⌘P</span></div>
  </div><!-- Scripts -->
  <script type="module" src="./main.ts"></script>
</body>

</html>
