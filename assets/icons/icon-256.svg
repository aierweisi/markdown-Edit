<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 四色渐变, 135deg 等价 (x1=0%,y1=0%) -> (x2=100%,y2=100%) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="35%"  stop-color="#6366f1"/>
      <stop offset="70%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- 顶部柔和高光 -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 投影 (用 indigo 染色, 而不是中性灰, 跟主色调一致) -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10.24" stdDeviation="15.36" flood-color="#4338ca" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 投影层 -->
  <rect x="20" y="27.68" width="216" height="216" rx="61"
        fill="#4338ca" opacity="0.25" filter="url(#shadow)"/>

  <!-- 主背景 (四色渐变) -->
  <rect x="20" y="20" width="216" height="216" rx="61" fill="url(#bg)"/>

  <!-- 顶部内高光 -->
  <rect x="20" y="20" width="216" height="108" rx="61" fill="url(#shine)"/>

  <!-- 主字 "M" -->
  <text
    x="128"
    y="143.36"
    font-family="-apple-system, 'Segoe UI', 'PingFang SC', Arial, sans-serif"
    font-weight="800"
    font-size="107.52"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-2.56"
  >M</text>

  <!-- 右下小箭头 "↓" -->
  <text
    x="186.88"
    y="202.24"
    font-family="-apple-system, 'Segoe UI', 'PingFang SC', Arial, sans-serif"
    font-weight="700"
    font-size="56.32"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.92"
  >↓</text>

  <!-- 内部 1px 白色描边, 提高边缘锐度 -->
  <rect x="20" y="20" width="216" height="216" rx="61"
        fill="none" stroke="white" stroke-width="3.072" stroke-opacity="0.18"/>
</svg>