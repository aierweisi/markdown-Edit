<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 四色渐变, 135deg 等价 (x1=0%,y1=0%) -> (x2=100%,y2=100%) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06b6d4"/>
      <stop offset="35%"  stop-color="#6366f1"/>
      <stop offset="70%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <!-- 顶部柔和高光 -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="60%"  stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- 投影 (用 indigo 染色, 而不是中性灰, 跟主色调一致) -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="20.48" stdDeviation="30.72" flood-color="#4338ca" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 投影层 -->
  <rect x="41" y="56.36" width="430" height="430" rx="123"
        fill="#4338ca" opacity="0.25" filter="url(#shadow)"/>

  <!-- 主背景 (四色渐变) -->
  <rect x="41" y="41" width="430" height="430" rx="123" fill="url(#bg)"/>

  <!-- 顶部内高光 -->
  <rect x="41" y="41" width="430" height="215" rx="123" fill="url(#shine)"/>

  <!-- 主字 "M" -->
  <text
    x="256"
    y="286.72"
    font-family="-apple-system, 'Segoe UI', 'PingFang SC', Arial, sans-serif"
    font-weight="800"
    font-size="215.04"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    letter-spacing="-5.12"
  >M</text>

  <!-- 右下小箭头 "↓" -->
  <text
    x="373.76"
    y="404.48"
    font-family="-apple-system, 'Segoe UI', 'PingFang SC', Arial, sans-serif"
    font-weight="700"
    font-size="112.64"
    fill="white"
    text-anchor="middle"
    dominant-baseline="middle"
    opacity="0.92"
  >↓</text>

  <!-- 内部 1px 白色描边, 提高边缘锐度 -->
  <rect x="41" y="41" width="430" height="430" rx="123"
        fill="none" stroke="white" stroke-width="6.144" stroke-opacity="0.18"/>
</svg>